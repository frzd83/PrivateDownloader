name: Deploy Personal Downloader

on:
  workflow_dispatch:

jobs:
  build:  # این اسم تغییر کرد تا با ساختار مطابقت داشته باشد
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create output file
        run: |
          echo "این فایل توسط workflow ساخته شده" > result.txt
          echo "محتوای دلخواه شما" >> result.txt
          cat worker.js || echo "worker.js پیدا نشد" >> result.txt
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-output
          path: result.txt
