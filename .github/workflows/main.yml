name: Deploy Personal Downloader

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build final output
        run: |
          echo "✅ فایل worker.js دریافت شد"
          echo "📄 محتویات فایل:"
          cat worker.js || echo "فایل worker.js پیدا نشد، یک نمونه می‌سازیم"
          echo "// This is the worker.js content" > worker.js
          
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-output
          path: worker.js
